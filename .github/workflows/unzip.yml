name: Unzip project
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o moybirr-security-fix*.zip -d tmp_extract
          cp -r tmp_extract/moybirr/. .
          rm -rf tmp_extract
          rm -f moybirr-security-fix*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project files" || echo "nothing to commit"
          git push
